name: CI

# Run on EVERY push, and on pull requests. Red here means "do not merge".
# (Free plan: no branch protection — the discipline is manual, see docs/adr/0010.)
on:
  push:
  pull_request:

# Newer pushes cancel older in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint + type-check (coding & a11y standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint (includes jsx-a11y accessibility rules)
        run: npm run lint
      - name: TypeScript type-check
        run: npm run typecheck

  unit-tests:
    name: Unit tests (BDD scenarios from Week 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test

  build:
    name: Production build (deploy-ready smoke)
    runs-on: ubuntu-latest
    # Placeholder public env so `next build` can prerender static pages.
    # These are NOT secrets — the real values live in Vercel. The anon key is
    # browser-safe by design; the service-role key is never used at build.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: next build
        run: npm run build

  skills-gate:
    name: Skills gate (Week 1 skills — integrity + enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enforce Week 1 Claude Skills
        run: npm run skills:gate
